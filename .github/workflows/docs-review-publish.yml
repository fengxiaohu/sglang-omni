name: Publish Selected Docs Review Findings

on:
  workflow_dispatch:
    inputs:
      review_run_id:
        description: Completed advisory review run ID
        required: true
        type: string
      finding_numbers:
        description: Comma-separated numbers selected from the private report
        required: true
        type: string

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

jobs:
  publish:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install 'pydantic==2.12.5' 'cryptography==44.0.0'
      - name: Publish selected findings
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REVIEW_RUN_ID: ${{ inputs.review_run_id }}
          FINDING_NUMBERS: ${{ inputs.finding_numbers }}
          DOCS_REVIEW_REPORT_KEY: ${{ secrets.DOCS_REVIEW_REPORT_KEY }}
        run: python -m scripts.docs_review.github_publish
