name: Advisory Docs Review

on:
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Pull request number to review
        required: true
        type: string
      offline:
        description: Run collection only without a model call
        required: true
        default: true
        type: boolean
      follow_up:
        description: Authorize the second review of this pull request
        required: true
        default: false
        type: boolean
      include_pr_body:
        description: Include the pull request description in the review
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: advisory-docs-review-ledger
  queue: max

jobs:
  review:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install reviewer dependencies
        run: python -m pip install 'pydantic==2.12.5' 'cryptography==44.0.0'
      - name: Review fixed pull request revisions
        id: review
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST_NUMBER: ${{ inputs.pull_request_number }}
          OFFLINE_REVIEW: ${{ inputs.offline }}
          FOLLOW_UP: ${{ inputs.follow_up }}
          INCLUDE_PR_BODY: ${{ inputs.include_pr_body }}
          DOCS_REVIEW_MODEL: ${{ vars.DOCS_REVIEW_MODEL }}
          DOCS_REVIEW_BUDGET: ${{ vars.DOCS_REVIEW_BUDGET }}
          DOCS_REVIEW_API_KEY: ${{ secrets.TEST1 }}
          DOCS_REVIEW_REPORT_KEY: ${{ secrets.DOCS_REVIEW_REPORT_KEY }}
        run: python -m scripts.docs_review.github_pilot
      - name: Upload encrypted report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: docs-review-${{ github.run_id }}
          path: ${{ runner.temp }}/docs-review/report.fernet
          if-no-files-found: error
          retention-days: 30
      - name: Report incomplete review
        if: ${{ !inputs.offline && (steps.review.outputs.execution != 'complete' || steps.review.outputs.stale == 'true') }}
        run: exit 1
