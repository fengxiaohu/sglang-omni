name: Pytest partition acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-test-cpu:
    name: round-${{ matrix.round }}-unit-test-cpu-${{ matrix.partition }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        round: [1, 2, 3]
        partition: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      CUDA_VISIBLE_DEVICES: ""
      OMNI_CI_PRELOAD_SESSION_WORKERS: "1"
      UV_TORCH_BACKEND: cpu
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      SGLANG_OMNI_TORCH_COMPILE_DEFAULT: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Measure host Python throughput
        shell: bash
        run: |
          lscpu
          python3 - <<'PY'
          import os
          from pathlib import Path
          from statistics import median
          from time import perf_counter
          paths = sorted(Path("sglang_omni/pipeline").rglob("*.py"))
          sources = [(str(p), p.read_bytes()) for p in paths]
          samples = []
          for _ in range(5):
              start = perf_counter()
              for name, source in sources:
                  compile(source, name, "exec")
              samples.append(perf_counter() - start)
          print("Python compile seconds", samples, median(samples))
          with open(os.environ["GITHUB_ENV"], "a") as environment:
              print(f"CPU_PYTEST_WORKERS={2 if median(samples) >= 0.053 else 0}", file=environment)
          PY

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false

      - name: Install CPU test dependencies
        timeout-minutes: 10
        run: |
          # note (0xtoward): rank Ubuntu mirrors with priority:N so apt uses the fastest healthy mirror without load-balancing onto degraded regional EC2 mirrors.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            default_mirror=$(awk 'NF {print $1; exit}' /etc/apt/apt-mirrors.txt)
            best_mirror=""
            best_speed=0
            candidates=()
            while IFS= read -r m; do
              if [ -n "$m" ]; then
                candidates+=("$m")
              fi
            done < <(
              printf '%s\n' \
                "$default_mirror" \
                http://azure.archive.ubuntu.com/ubuntu/ \
                http://archive.ubuntu.com/ubuntu/ \
                | awk 'NF {sub(/\/+$/, ""); print $0 "/"}' \
                | awk '!seen[$0]++'
            )
            for mirror in "${candidates[@]}"; do
              speed=$(curl -4 -fsS --max-time 3 -o /dev/null -w '%{speed_download}' "${mirror}dists/noble/main/binary-amd64/Packages.xz" 2>/dev/null) || speed=0
              speed_int=${speed%%.*}
              speed_int=${speed_int:-0}
              echo "Ubuntu mirror probe: ${mirror} -> ${speed_int} B/s"
              if [ "$speed_int" -gt "$best_speed" ]; then
                best_speed=$speed_int
                best_mirror=$mirror
              fi
              if [ "$speed_int" -ge 5000000 ]; then
                break
              fi
            done
            if [ -n "$best_mirror" ]; then
              printf '%s\n' "$best_mirror" "${candidates[@]}" \
                | awk 'NF && !seen[$0]++ {printf "%s\tpriority:%d\n", $0, ++n}' \
                | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
              echo "Using Ubuntu apt mirror: ${best_mirror} (${best_speed} B/s)"
            fi
          fi
          sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get \
            -o Acquire::ForceIPv4=true -o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 \
            install -y --no-install-recommends ffmpeg sox
          uv venv --python 3.12
          python3 -c 'import tomllib; print("\n".join(tomllib.load(open("pyproject.toml", "rb"))["tool"]["uv"]["override-dependencies"]))' > "$RUNNER_TEMP/omni-overrides.txt"
          uv pip install --overrides "$RUNNER_TEMP/omni-overrides.txt" --find-links https://abetlen.github.io/llama-cpp-python/whl/cpu/llama-cpp-python/ \
            -e '.[audar-tts,fishaudio,fun-cosyvoice3,minicpm-o]'
          uv pip install pytest-xdist==3.8.0
          uv pip install --no-deps qwen-tts==0.1.1
          bash .github/scripts/install_ci_cosyvoice.sh .venv

      - name: Run CPU partition
        timeout-minutes: 30
        env:
          OMNI_CI_PYTHON: ${{ github.workspace }}/.venv/bin/python
          OMNI_CI_STAGE_LABEL: unit-test-cpu-${{ matrix.partition }}
          PARTITION: ${{ matrix.partition }}
          PARTITIONS: "8"
        run: |
          source .venv/bin/activate
          export PYTHONPATH="$PWD"
          bash .github/scripts/run_flaky_pytest.sh \
            pytest tests/ --basetemp="$(mktemp -d /tmp/pt.XXXXXX)" -n "$CPU_PYTEST_WORKERS" --dist=worksteal -v -m "not benchmark and not accelerator" -x \
            -p scripts.ci.utils.pytest_partition --auto-partition-id "$PARTITION" \
            --partition-prefilter all --auto-partition-size "$PARTITIONS" --partition-model-file .github/unit_test_durations.json \
            --junitxml="$RUNNER_TEMP/unit-test.xml"

      - name: Upload partition results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: round-${{ matrix.round }}-cpu-partition-${{ matrix.partition }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/unit-test.xml
            ${{ runner.temp }}/omni-ci-retry/


      - name: Capture same-revision node IDs
        if: ${{ !cancelled() && matrix.round == 2 }}
        env:
          PARTITION: ${{ matrix.partition }}
        run: |
          source .venv/bin/activate
          export PYTHONPATH="$PWD"
          mkdir -p "$RUNNER_TEMP/nodeids"
          for suite in cpu accelerator; do
            if [[ $suite == cpu ]]; then
              size=8
              marker='not benchmark and not accelerator'
              model=.github/unit_test_durations.json
              mode=all
            else
              size=2
              marker='accelerator and not benchmark'
              model=.github/unit_test_accelerator_durations.json
              mode=accelerator
            fi
            if (( PARTITION >= size )); then continue; fi
            for prefilter in none "$mode"; do
              output="$RUNNER_TEMP/nodeids/$suite-$prefilter-$PARTITION.txt"
              pytest tests/ --collect-only -q -m "$marker" -p scripts.ci.utils.pytest_partition --auto-partition-id "$PARTITION" --auto-partition-size "$size" --partition-model-file "$model" --partition-prefilter "$prefilter" > "$output" || { tail -100 "$output"; exit 1; }
            done
          done

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && matrix.round == 2 }}
        with:
          name: nodeids-${{ matrix.partition }}
          path: ${{ runner.temp }}/nodeids/
