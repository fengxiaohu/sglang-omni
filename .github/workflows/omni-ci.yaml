name: Container stop timeout smoke
on: workflow_dispatch
permissions: {}
jobs:
  engines:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Measure Docker and Podman stop defaults
        shell: bash
        run: |
          if ! command -v podman; then
            sudo apt-get update -qq && sudo apt-get install -y podman
          fi
          for engine in docker podman; do
            for timeout in default 2; do
              options=()
              if [[ $timeout != default ]]; then options+=(--stop-timeout=2); fi
              id=$(sudo "$engine" run -d "${options[@]}" docker.io/library/alpine:3.21 sh -c 'trap "" TERM; echo ready; while :; do sleep 1; done')
              until sudo "$engine" logs "$id" | grep -q ready; do sleep .1; done
              start=$(date +%s%N)
              sudo "$engine" stop "$id"
              milliseconds=$(( ($(date +%s%N) - start) / 1000000 ))
              echo "$engine timeout=$timeout stop_ms=$milliseconds"
              sudo "$engine" rm "$id"
              if [[ $timeout == 2 ]]; then test "$milliseconds" -le 3000; fi
            done
          done
