name: Advisory pull request review

on:
  workflow_dispatch:

permissions: {}

jobs:
  compare:
    if: github.repository == 'fengxiaohu/sglang-omni' && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
    strategy:
      fail-fast: false
      matrix:
        fixture: [34, 33, 37, 38]
    name: Compare fork PR ${{ matrix.fixture }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install 'pydantic==2.12.5'
      - name: Validate pinned before and after inputs
        env:
          GH_TOKEN: ${{ github.token }}
          FIXTURE_PR: ${{ matrix.fixture }}
          DOCS_REVIEW_MODEL: ${{ vars.DOCS_REVIEW_MODEL }}
          UNIT_TEST_REVIEW_MODEL: ${{ vars.UNIT_TEST_REVIEW_PILOT_MODEL || vars.UNIT_TEST_REVIEW_MODEL }}
          DOCS_REVIEW_BUDGET: ${{ vars.DOCS_REVIEW_BUDGET }}
          DOCS_REVIEW_API_KEY: ${{ secrets.TEST1 }}
        run: |
          if PYTHONPATH="$PWD" python .github/validate-unit-test-review.py > "$RUNNER_TEMP/acceptance.log" 2>&1; then
            echo "Acceptance passed for fork PR #$FIXTURE_PR"
          else
            echo "::error::Acceptance failed for fork PR #$FIXTURE_PR"
            exit 1
          fi
      - name: Encrypt validation evidence
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/acceptance.log" ]]; then
            openssl cms -encrypt -aes-256-cbc -binary -outform DER \
              -in "$RUNNER_TEMP/acceptance.log" -out "$RUNNER_TEMP/acceptance.cms" \
              .github/acceptance-report-cert.pem
          fi
      - name: Upload encrypted validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: acceptance-${{ matrix.fixture }}
          path: ${{ runner.temp }}/acceptance.cms
          retention-days: 1
