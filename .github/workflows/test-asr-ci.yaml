name: ASR CI

on:
  workflow_call:
    inputs:
      run_multi_speaker:
        description: Run the MOSS-TD multi-speaker job.
        type: boolean
        required: false
        default: true
      run_seedtts:
        description: Run the SeedTTS ASR job.
        type: boolean
        required: false
        default: true
      asr_ci_model:
        description: SeedTTS ASR model preset selected by the parent omni-ci preflight.
        type: string
        required: false
        default: fun
      omni_ci_home:
        description: PR-scoped CI home from the parent omni-ci workflow.
        type: string
        required: false
        default: ""

permissions:
  contents: read
  checks: read
  pull-requests: read

env:
  OMNI_CI_HOME: >-
    ${{ inputs.omni_ci_home != ''
        && inputs.omni_ci_home
        || format('/data/omni-ci/run-{0}', github.run_id) }}
  MOSS_TRANSCRIBE_DIARIZE_MODEL_PATH: OpenMOSS-Team/MOSS-Transcribe-Diarize

# Invoked by omni-ci.yaml after unit tests. Restores omni only.
# The jobs share no data, so they run side by side.

jobs:
  moss-td-multi-speaker:
    name: MOSS-TD multi-speaker
    if: inputs.run_multi_speaker
    runs-on: [self-hosted, pr4578-ab]
    # movies800 + stream + aishell4_long + googletime on DP=2.
    timeout-minutes: 90
    container:
      image: docker.io/hongccc/sglang-omni@sha256:d2fbd80ec42c8a6d9dff4b8a4fdbee35d50c5a1b41aa8dc872925da6e0c82f6a
      options: >-
        --rm
        -e NVIDIA_VISIBLE_DEVICES
        -e OMNI_CI_CPUSET
        -v /dev/shm:/dev/shm
        -v /data/fengxiaohu/home/pr4578-pair3.03GmVkPW/whisper/base/ci:/data/omni-ci
        -v /data/fengxiaohu/home/pr4578-pair3.03GmVkPW/whisper/base/hf:/github/home/.cache/huggingface
        -v /data/fengxiaohu/home/pr4578-pair3.03GmVkPW/whisper/base/hf:/root/.cache/huggingface
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: ./.github/actions/omni-setup
        with:
          venv-name: omni

      - name: Run MOSS-Transcribe-Diarize multi-speaker CI
        shell: bash
        run: |
          source omni/bin/activate
          export PYTHONPATH=$PWD
          bash .github/scripts/run_flaky_pytest.sh \
            pytest tests/test_model/test_asr_ci_multi_speaker.py -v -s -x
        env:
          HF_ENDPOINT: https://huggingface.co
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          MOSS_TRANSCRIBE_DIARIZE_MODEL_PATH: ${{ env.MOSS_TRANSCRIBE_DIARIZE_MODEL_PATH }}
          TORCHINDUCTOR_CACHE_DIR: ${{ env.OMNI_CI_HOME }}/.torchinductor

      - name: Post-stage cleanup
        if: always()
        uses: ./.github/actions/omni-post-stage
        with:
          stage-label: ASR MOSS-TD multi-speaker
          artifact-path-globs: |
            */moss_transcribe_diarize_results.json
            */moss_transcribe_diarize_stream_results.json
            */moss_transcribe_diarize_aishell4_long_results.json
            */moss_transcribe_diarize_aishell4_long90_results.json
            */moss_transcribe_diarize_googletime_results.json
          artifact-upload-name: asr-stage-multi-speaker-results-attempt-${{ github.run_attempt }}
          artifact-upload-path: |
            /tmp/**/moss_transcribe_diarize_results.json
            /tmp/**/moss_transcribe_diarize_stream_results.json
            /tmp/**/moss_transcribe_diarize_aishell4_long_results.json
            /tmp/**/moss_transcribe_diarize_aishell4_long90_results.json
            /tmp/**/moss_transcribe_diarize_googletime_results.json
          summary-only: "true"

  seedtts:
    name: SeedTTS ASR
    if: inputs.run_seedtts
    runs-on: [self-hosted, pr4578-ab, slot-0]
    timeout-minutes: 30
    container:
      image: docker.io/hongccc/sglang-omni@sha256:d2fbd80ec42c8a6d9dff4b8a4fdbee35d50c5a1b41aa8dc872925da6e0c82f6a
      options: >-
        --rm
        --device nvidia.com/gpu=GPU-8c2e7fe8-6622-46fc-374a-1b0bea3c1a31
        -e NVIDIA_VISIBLE_DEVICES
        -e OMNI_CI_CPUSET
        -v /dev/shm:/dev/shm
        -v /data/fengxiaohu/home/pr4578-pair3.03GmVkPW/whisper/base/ci:/data/omni-ci
        -v /data/fengxiaohu/home/pr4578-pair3.03GmVkPW/whisper/base/hf:/github/home/.cache/huggingface
        -v /data/fengxiaohu/home/pr4578-pair3.03GmVkPW/whisper/base/hf:/root/.cache/huggingface
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: ./.github/actions/omni-setup
        with:
          venv-name: omni

      - name: Run SeedTTS ASR CI
        shell: bash
        run: |
          source omni/bin/activate
          export CUDA_VISIBLE_DEVICES=0,1
          nvidia-smi --query-gpu=uuid --format=csv,noheader
          python -c "import torch; assert torch.cuda.device_count() == 2"
          export PYTHONPATH=$PWD
          nvidia-smi --query-gpu=timestamp,index,utilization.gpu,memory.used,clocks.sm,power.draw --format=csv,noheader,nounits -l 5 > /tmp/whisper-control-gpu.csv &
          monitor=$!
          trap 'kill "$monitor" 2>/dev/null || true' EXIT
          status=0
          for sample in 1 2; do
            echo "CONTROL SAMPLE $sample"
            OMNI_CI_MAX_ATTEMPTS=1 OMNI_CI_STAGE_LABEL="control-$sample" bash .github/scripts/run_flaky_pytest.sh pytest tests/test_model/test_asr_ci_seedtts.py::test_asr_matches_seedtts_reference_text_en -v -s || status=1
          done
          cat /tmp/whisper-control-gpu.csv
          exit "$status"
        env:
          ASR_CI_MODEL: ${{ inputs.asr_ci_model }}
          HF_ENDPOINT: https://huggingface.co
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          TORCHINDUCTOR_CACHE_DIR: ${{ env.OMNI_CI_HOME }}/.torchinductor

      - name: Post-stage cleanup
        if: always()
        uses: ./.github/actions/omni-post-stage
        with:
          stage-label: ASR SeedTTS
          artifact-path-globs: |
            */asr_seedtts_en_results.json
            */asr_seedtts_zh_results.json
          artifact-upload-name: asr-stage-seedtts-results-attempt-${{ github.run_attempt }}
          artifact-upload-path: |
            /tmp/**/asr_seedtts_en_results.json
            /tmp/**/asr_seedtts_zh_results.json
          summary-only: "true"
