name: Label documentation pull requests

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Verification pull request number
        required: true
        type: number

permissions: {}

jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Add the documentation label
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          VERIFICATION_PR_NUMBER: ${{ inputs.pr_number }}
        with:
          github-token: ${{ github.token }}
          script: |
            const pullRequestNumber = Number(process.env.VERIFICATION_PR_NUMBER);
            if (pullRequestNumber !== 40) {
              throw new Error("This workflow can only verify fork PR 40.");
            }
            const pullRequestResponse = await github.rest.pulls.get({
              ...context.repo,
              pull_number: pullRequestNumber,
            });
            context.payload.pull_request = pullRequestResponse.data;

            const pullRequest = context.payload.pull_request;
            if (pullRequest.labels.some(({ name }) => name === 'documentation')) {
              return;
            }

            const { owner, repo } = context.repo;
            const isDocumentationPath = (path) =>
              path?.startsWith('docs/') ||
              path === 'README.md' ||
              path === 'CONTRIBUTING.md';

            const pages = github.paginate.iterator(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: pullRequest.number,
              per_page: 100,
            });
            for await (const { data: files } of pages) {
              const touchesDocumentation = files.some(({ filename, previous_filename }) =>
                isDocumentationPath(filename) || isDocumentationPath(previous_filename)
              );
              if (touchesDocumentation) {
                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number: pullRequest.number,
                  labels: ['documentation'],
                });
                return;
              }
            }
